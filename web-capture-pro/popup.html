<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Capture Pro</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <img src="icons/icon.svg" alt="Web Capture Pro" class="logo" />
        <div>
          <h1>Web Capture Pro</h1>
          <p>Professional screenshot, image & video toolkit</p>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="screenshot">Screenshot</button>
        <button class="tab" data-tab="images">Images</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>

      <section class="panel active" id="screenshot-panel">
        <div class="card">
          <h2>Full Page Capture</h2>
          <p>Capture the full scrollable page and stitch at high resolution.</p>
          <div class="actions">
            <button id="capture-btn" class="btn primary">Capture Full Page</button>
            <button id="download-shot-btn" class="btn" disabled>Download PNG</button>
            <button id="copy-shot-btn" class="btn" disabled>Copy to Clipboard</button>
          </div>
          <div class="progress-wrap">
            <div id="capture-progress" class="progress"></div>
          </div>
          <p id="capture-status" class="status">Ready.</p>
        </div>
      </section>

      <section class="panel" id="images-panel">
        <div class="card">
          <h2>Smart Media Downloader</h2>
          <div class="row">
            <button id="scan-images-btn" class="btn primary">Scan Media</button>
            <button id="download-all-btn" class="btn" disabled>Download All</button>
            <button id="toggle-select-btn" class="btn">Image Select Mode</button>
          </div>
          <div class="row">
            <label for="filter">Filter</label>
            <select id="filter">
              <option value="all">All</option>
              <option value="image">Images only</option>
              <option value="video">Videos only</option>
              <option value="500">&gt; 500px</option>
              <option value="1000">&gt; 1000px</option>
            </select>
          </div>
          <p id="image-status" class="status">No scan yet.</p>
          <div id="image-grid" class="image-grid"></div>
        </div>
      </section>

      <section class="panel" id="settings-panel">
        <div class="card">
          <h2>Settings</h2>
          <label class="switch-row">
            <input type="checkbox" id="auto-download" checked />
            <span>Auto download after capture</span>
          </label>
          <label class="switch-row">
            <input type="checkbox" id="high-res" checked />
            <span>Prefer full-size URL extraction</span>
          </label>
          <p class="status">Settings are synced with Chrome storage.</p>
        </div>
      </section>
    </main>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
